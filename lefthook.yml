# Lefthook configuration
# Refer to https://github.com/evilmartians/lefthook/blob/master/docs/full_guide.md for more info

pre-commit:
  parallel: true
  commands:
    markdown-lint:
      glob: "*.md"
      run: npx markdownlint {staged_files} --fix
    backend-lint:
      root: "backend/"
      glob: "*.{ts,js,json}"
      run: npm run lint
    frontend-lint:
      root: "frontend-v2/"
      glob: "*.{ts,vue,js,json}"
      run: npm run lint
    backend-coverage-staged:
      root: "backend/"
      glob: "src/**/*.ts"
      # Ejecuta solo tests relacionados y mide cobertura solo de los archivos en el commit
      run: npx jest --findRelatedTests {staged_files} --coverage --collectCoverageFrom="{staged_files}" --passWithNoTests

pre-push:
  commands:
    backend-tests-coverage:
      root: "backend/"
      run: npm run test:ci -- --coverageReporters="text-summary"
    ai-review:
      run: node .agent/scripts/review-agent.js
