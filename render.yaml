services:
  - type: web
    name: collaborative-saving-backend
    runtime: node
    rootDir: backend
    plan: free
    region: ohio
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_SSL
        value: "true"
      - key: ENABLE_SWAGGER
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://collaborative-saving.fmartinez.net,https://mobile-collaborative-saving.fmartinez.net,https://collaborative-saving.web.app,https://mobile-collaborative-saving.web.app,https://collaborative-saving--*.web.app,https://mobile-collaborative-saving--*.web.app
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: APP_BLIND_INDEX_SALT
        sync: false
