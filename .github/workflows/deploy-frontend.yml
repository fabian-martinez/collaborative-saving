name: Deploy Frontend to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'frontend-v2/**'
      - 'frontend-mobile/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend-v2/**'
      - 'frontend-mobile/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend-v2/package-lock.json
            frontend-mobile/package-lock.json

      - name: Install dependencies (Web)
        run: |
          cd frontend-v2
          npm install

      - name: Build Web frontend (Vue 3)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_API_VERSION: v2
          VITE_USE_MOCKS: 'false'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          cd frontend-v2
          npm run build

      - name: Install dependencies (Mobile)
        run: |
          cd frontend-mobile
          npm install

      - name: Build Mobile frontend (Vue 3 Mobile)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_USE_MOCKS: 'false'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          cd frontend-mobile
          npm run build

      - name: Check Firebase Service Account Secret
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: |
          echo "::warning::El secreto 'FIREBASE_SERVICE_ACCOUNT' no esta configurado en GitHub Secrets."
          echo "::warning::Para habilitar el despliegue automatico en Firebase Hosting, agrega 'FIREBASE_SERVICE_ACCOUNT' en Settings -> Secrets and variables -> Actions."

      - name: Deploy Web Preview to Firebase Hosting (on PR)
        if: github.event_name == 'pull_request' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          target: web
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'collaborative-saving' }}

      - name: Deploy Mobile Preview to Firebase Hosting (on PR)
        if: github.event_name == 'pull_request' && env.FIREBASE_SERVICE_ACCOUNT != ''
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          target: mobiel-collaborative-saving
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'collaborative-saving' }}

      - name: Deploy Web Live to Firebase Hosting (on Main)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          target: web
          channelId: live
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'collaborative-saving' }}

      - name: Deploy Mobile Live to Firebase Hosting (on Main)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.FIREBASE_SERVICE_ACCOUNT != ''
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          target: mobiel-collaborative-saving
          channelId: live
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'collaborative-saving' }}
